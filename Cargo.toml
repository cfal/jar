[package]
name = "job-runner-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight Linux process supervisor"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.9"
chrono = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
