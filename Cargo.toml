[package]
name = "jar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight Linux process supervisor"
license = "GPL-3.0-only"
repository = "https://github.com/cfal/jar"
readme = "README.md"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/licenses/**", "/about.toml", "/scripts/**"]

[[bin]]
name = "jr"
path = "src/main.rs"

[dependencies]
tokio = { version = "*", features = ["full"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_yaml = "*"
rand = "*"
chrono = "*"
libc = "*"

[dev-dependencies]
tempfile = "*"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
