[package]
name = "job-runner-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "*", features = ["full"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_yaml = "*"
rand = "*"
chrono = "*"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
