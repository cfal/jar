[package]
name = "jar"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A lightweight Linux process supervisor"
license = "GPL-3.0-only"
repository = "https://github.com/cfal/jar"
readme = "README.md"
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/licenses/**", "/about.toml", "/scripts/**"]

[[bin]]
name = "jr"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53.3", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
rand = "0.10.3"
chrono = "0.4.45"
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
